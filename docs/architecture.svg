    <text x="610" y="283" text-anchor="middle" class="svg-mono" font-size="9.8" font-weight="600" fill="#1E3A8A">entity_resolver.py · 64 Permutations</text>
    <text x="610" y="303" text-anchor="middle" class="svg-mono" font-size="9.3" fill="#3F3F46">Blocks by brand:product_type + MPN</text>
  </g>

