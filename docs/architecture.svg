<svg viewBox="0 0 1220 730" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="CatalogDawn System Architecture Diagram">
  <defs>
    <pattern id="archDotGrid" width="20" height="20" patternUnits="userSpaceOnUse">
