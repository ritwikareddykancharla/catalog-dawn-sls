    <rect x="92" y="666" width="440" height="28" fill="#FFFFFF" stroke="#18181B" stroke-width="1.6" />
    <text x="312" y="684" text-anchor="middle" class="svg-mono" font-size="9.6" font-weight="700" fill="#C2410C">79.0% Lower Token Cost per 10k SKUs</text>
