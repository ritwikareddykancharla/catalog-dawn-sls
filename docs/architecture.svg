    <path d="M 824,233 Q 1001,229 1178,234 Q 1182,279 1177,324 Q 1000,328 825,323 Q 821,278 824,233 Z" fill="#FEE2E2" stroke="#18181B" stroke-width="2.1" />
    <text x="1001" y="261" text-anchor="middle" class="svg-title" font-size="22" font-weight="700" fill="#991B1B">Hard Variant Veto Gate</text>
    <text x="1001" y="283" text-anchor="middle" class="svg-mono" font-size="9.8" font-weight="700" fill="#18181B">pack_count · storage · voltage · size</text>
    <text x="1001" y="303" text-anchor="middle" class="svg-mono" font-size="9.3" fill="#7F1D1D">0% false variant conflation across 200 pairs</text>
  </g>

