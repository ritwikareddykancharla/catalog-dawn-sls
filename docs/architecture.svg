    <text x="901" y="629" text-anchor="middle" class="svg-mono" font-size="10" font-weight="700" fill="#18181B">64-Record Holdout + SHA-256 WAL Audit</text>
    <text x="901" y="651" text-anchor="middle" class="svg-mono" font-size="9.4" fill="#78350F">Promotes rules only at &gt;=95% precision &amp; &lt;=2% FPR</text>
    <rect x="681" y="666" width="440" height="28" fill="#DCFCE7" stroke="#18181B" stroke-width="1.6" />
    <text x="901" y="684" text-anchor="middle" class="svg-mono" font-size="9.6" font-weight="700" fill="#065F46">Holdout Defect Recall: 37.5% -&gt; 93.8%</text>
