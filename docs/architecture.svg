    <text x="312" y="468" text-anchor="middle" class="svg-mono" font-size="9.8" font-weight="700" fill="#065F46">0,065 kW -&gt; 65 W · 16.9 fl oz -&gt; 500 ml · mAh -&gt; Wh</text>
