  <path d="M 22,196 Q 610,192 1196,197 Q 1200,268 1195,338 Q 608,342 24,337 Q 19,266 22,196 Z" fill="#FFF7ED" stroke="#C2410C" stroke-width="1.6" stroke-dasharray="8 6" />
