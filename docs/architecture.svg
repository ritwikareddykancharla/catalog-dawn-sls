    <text x="901" y="468" text-anchor="middle" class="svg-mono" font-size="9.8" font-weight="700" fill="#1E3A8A">OEM Manual (1.0) + Returns (0.92) &gt; Seller Claim (0.50)</text>
    <text x="901" y="489" text-anchor="middle" class="svg-mono" font-size="9.3" fill="#3F3F46">Span grounding check blocks hallucinated specs</text>
