  <path d="M 22,380 Q 610,376 1196,381 Q 1200,452 1195,522 Q 608,526 24,521 Q 19,450 22,380 Z" fill="#F0FDF4" stroke="#065F46" stroke-width="1.6" stroke-dasharray="8 6" />
  <text x="36" y="404" class="svg-title" font-size="21" font-weight="700" fill="#065F46">3. Cross-Marketplace (US / DE / JP) Ontology Normalizer &amp; Contradiction Resolver</text>

