[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "catalog-dawn-sls"
version = "1.0.0"
description = "CatalogDawn: External Merchant Offer Ingestion, Variant-Safe ASIN Matching, Cross-Locale Normalization & Self-Learning Catalog System"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Ritwika Reddy Kancharla" }]
dependencies = ["boto3>=1.34.0"]

[tool.setuptools.packages.find]
include = ["catalog_dawn*"]
